dataset: mumtaz
model:
  num_channels: 19
  num_samples: 1000
  temporal_filters: 40
  temporal_kernel: 51
  pool_kernel: 150
  pool_stride: 30
  energy_bins: 16
  embedding_width: 96
  dropout: 0.5
  num_classes: 2
  mirror_permutation:
  - 1
  - 0
  - 3
  - 2
  - 5
  - 4
  - 7
  - 6
  - 9
  - 8
  - 11
  - 10
  - 13
  - 12
  - 15
  - 14
  - 16
  - 17
  - 18
  input_precision: float64
  reflection_init: physical
  reflection_init_strength: 0.0
  reflection_init_seed: 101
  initial_reflection_precision: float32
  ensemble:
    enabled: true
    size: 3
    aggregation: mean_logits
    members:
    - name: seed_0042
      seed: 42
      model_overrides: {}
    - name: seed_0043
      seed: 43
      model_overrides: {}
    - name: seed_0044
      seed: 44
      model_overrides: {}
training:
  bootstrap_max_steps: 800
  bootstrap_val_every: 100
  bootstrap_patience: 3
  max_steps: 8000
  val_every: 100
  lr_warmup_steps: 300
  patience: 15
  batch_size: 64
  eval_batch_size: 128
  num_workers: 2
  amp: true
  deterministic: true
  balanced_sampler: true
  sampler_power: 1.0
  noise_std: 0.0
  time_mask_prob: 0.0
  time_mask_ratio: 0.05
  mixup_alpha: 0.2
  bootstrap_backbone_lr: 0.0003
  bootstrap_head_lr: 0.001
  backbone_lr: 0.0003
  head_lr: 0.001
  axis_lr: 0.001
  reflection_lr: 0.001
  weight_decay: 0.001
  label_smoothing: 0.05
  grad_clip: 1.0
  mode: steps
  optimizer_betas:
  - 0.9
  - 0.99
  batch_order: torch_dataloader
  joint_seed_offset: 730019
  joint_seed_reset: after_model
  warmup_checkpoint: best
  axis_weight_decay: 0.0
  reflection_weight_decay: 0.0
  schedule: cosine
  pca_amp: true
input:
  sampling_rate_hz: 200
  channel_names:
  - Fp1
  - Fp2
  - F3
  - F4
  - C3
  - C4
  - P3
  - P4
  - O1
  - O2
  - F7
  - F8
  - T3
  - T4
  - T5
  - T6
  - Fz
  - Cz
  - Pz
evaluation:
  target_balanced_accuracy_percent: 97.44
